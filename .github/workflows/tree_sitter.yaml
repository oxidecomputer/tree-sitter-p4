name: Tree-sitter P4

on:
  push:
    branches: [main]
  pull_request:

# Limit the GITHUB_TOKEN to reads because the workflow only checks out
# and parses.
permissions:
  contents: read

jobs:
  tree-sitter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned: src/ is committed, so the CLI that regenerates it in the
      # check below has to be the one that produced it. Bumping this means
      # regenerating src/ in the same commit.
      - name: setup Tree-sitter
        uses: tree-sitter/setup-action@v2
        with:
          tree-sitter-ref: v0.26.8

      # src/ is generated from grammar.js and committed so that consumers
      # build without the CLI. Nothing else here regenerates it, so a commit
      # that edits the grammar without running `tree-sitter generate` would
      # otherwise parse against a stale parser.c.
      - name: check generated parser is current
        run: |
          tree-sitter generate
          git diff --exit-code src/

      # The examples below are checked only for errors. The corpus pins the
      # trees of inputs that parse cleanly under more than one reading, such
      # as a cast against a parenthesized expression.
      - name: run Tree-sitter corpus tests
        run: tree-sitter test

      - name: run Tree-sitter stats
        run: tree-sitter parse -q -s examples/*.p4 || exit 0

      # Match MISSING as well as ERROR: error recovery for an absent
      # token inserts a zero-width missing node, and those summaries
      # print MISSING instead of ERROR.
      - name: run Tree-sitter error check
        run: |
          set +e
          output=$(tree-sitter parse -q examples/*.p4 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -ne 0 ]; then
            echo "tree-sitter parse failed with status $status"
            exit "$status"
          fi

          if grep -Eq "ERROR|MISSING" <<<"$output"; then
            exit 1
          fi

      # Real programs use far more of the language than the examples do:
      # p4c's 1,300 sample programs and its architecture includes, and
      # dendrite's sidecar. Both are pinned, so that a change upstream
      # cannot turn this job red; move a pin deliberately.
      - name: check out p4c's samples
        uses: actions/checkout@v4
        with:
          repository: p4lang/p4c
          ref: 15b81c81f9911439215de6a6236c201d08212dbc
          path: .real-world/p4c
          filter: blob:none
          sparse-checkout: |
            testdata/p4_16_samples
            p4include
          persist-credentials: false

      - name: check out dendrite
        uses: actions/checkout@v4
        with:
          repository: oxidecomputer/dendrite
          ref: 9ffd5a1a49eb4b0c48eb66a139298e90b0951796
          path: .real-world/dendrite
          filter: blob:none
          sparse-checkout: dpd/p4
          persist-credentials: false

      # The p4c files the grammar does not parse yet are listed, with the
      # reason, in test/p4c-known-failures.txt. A listed file that parses
      # fails the step too, so that the list only ever shrinks. Only regular
      # files are parsed: some samples are links into p4c's backends, which
      # the sparse checkout leaves out, and one missing file stops the CLI.
      - name: parse real-world programs
        run: |
          sed -e '/^#/d' -e '/^$/d' -e 's|^|.real-world/p4c/|' \
            test/p4c-known-failures.txt | sort > "$RUNNER_TEMP/known.txt"
          find .real-world/p4c/testdata/p4_16_samples .real-world/p4c/p4include \
            .real-world/dendrite/dpd/p4 -maxdepth 1 -type f -name '*.p4' |
            sort | comm -23 - "$RUNNER_TEMP/known.txt" > "$RUNNER_TEMP/paths.txt"
          echo "parsing $(wc -l < "$RUNNER_TEMP/paths.txt") files"

          set +e
          output=$(tree-sitter parse -q --paths "$RUNNER_TEMP/paths.txt" 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ] || grep -Eq "ERROR|MISSING" <<<"$output"; then
            printf '%s\n' "$output"
            exit 1
          fi

          tree-sitter parse -q --paths "$RUNNER_TEMP/known.txt" 2>&1 |
            grep -E "ERROR|MISSING" | awk '{print $1}' | sort > "$RUNNER_TEMP/failing.txt" || true
          fixed=$(comm -23 "$RUNNER_TEMP/known.txt" "$RUNNER_TEMP/failing.txt")
          if [ -n "$fixed" ]; then
            echo "These now parse; take them off test/p4c-known-failures.txt:"
            printf '%s\n' "$fixed"
            exit 1
          fi

      # The bindings declare the language function by name, and nothing else
      # here links them: a misspelled symbol or a source file missing from a
      # build script surfaces only in a consumer's build.
      - name: test Rust binding
        run: cargo test

      - name: test Go binding
        working-directory: bindings/go
        run: GOFLAGS=-mod=mod go test ./...

      # A query naming a node type the grammar no longer has fails to compile
      # outright rather than degrading, and `parse` stays green either way.
      - name: check queries compile
        run: |
          for query in queries/*.scm queries/*/*.scm topiary/p4.scm; do
            [ -f "$query" ] || continue
            tree-sitter query "$query" examples/parser.p4 >/dev/null
          done

      # Neovim's highlights are derived from Helix's and committed, so that
      # they can be installed straight from the repository.
      - name: check Neovim highlights are up to date
        run: |
          make -B queries/nvim/highlights.scm
          git diff --exit-code queries/nvim/highlights.scm

      # The formatting queries name a couple of dozen node types, so a change
      # to the grammar can degrade the formatter without breaking a parse.
      # Topiary already checks that formatting twice (idempotence) gives the
      # same result and exits non-zero when it does not, so this step adds
      # only the guarantee that no text is lost.
      - name: cache Topiary
        id: cache-topiary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/topiary
          key: topiary-${{ runner.os }}-0.7.3

      - name: install Topiary
        if: steps.cache-topiary.outputs.cache-hit != 'true'
        run: cargo install topiary-cli --version 0.7.3 --locked

      - name: run formatter check
        run: |
          make topiary/grammar.so

          # The fixture pins the layout: changing it has to be deliberate, by
          # updating expected.p4. The loop below is weaker, and only checks
          # that real programs come through with their text and syntax tree
          # intact. The tree catches tokens that formatting joins, such as a
          # macro name and the field that follows it, which the text alone
          # does not.
          cp topiary/tests/input.p4 "$RUNNER_TEMP/fixture.p4"
          TOPIARY_LANGUAGE_DIR=topiary topiary format \
            -C topiary/languages.ncl "$RUNNER_TEMP/fixture.p4"
          diff -u topiary/tests/expected.p4 "$RUNNER_TEMP/fixture.p4"

          tree() {
            tree-sitter parse "$1" |
              sed -E 's/ \[[0-9]+, [0-9]+\] - \[[0-9]+, [0-9]+\]//'
          }
          for f in examples/*.p4; do
            staged="$RUNNER_TEMP/$(basename "$f")"
            cp "$f" "$staged"
            TOPIARY_LANGUAGE_DIR=topiary topiary format \
              -C topiary/languages.ncl "$staged"
            before=$(tr -d '[:space:]' < "$f" | sha256sum)
            after=$(tr -d '[:space:]' < "$staged" | sha256sum)
            if [ "$before" != "$after" ]; then
              echo "$f: formatting changed more than whitespace"
              diff -u "$f" "$staged" || true
              exit 1
            fi
            if [ "$(tree "$f")" != "$(tree "$staged")" ]; then
              echo "$f: formatting changed the syntax tree"
              diff -u <(tree "$f") <(tree "$staged") || true
              exit 1
            fi
          done

      - name: check formatting
        run: npx -y prettier@3.2.4 --check .
